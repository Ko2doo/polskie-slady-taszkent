# Merge gate, automated part: lint, formatting, the whole test suite and a clean build (see
# CONTRIBUTING.md). `npm run build` re-runs lint + format:check through `prebuild` — a few seconds,
# kept so a local build is checked the same way; the explicit steps fail fast with a clear name.
name: CI

on:
  pull_request:
    branches: [features, master]
  push:
    branches: [features, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
